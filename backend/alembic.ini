# Configuración de Alembic para EcoAudit.
#
# La URL de la base NO se define aquí: ``migrations/env.py`` la toma de
# ``get_settings().database_url`` (variable ``ECOAUDIT_DATABASE_URL``).
#
# Uso manual, desde ``backend/``:
#     alembic upgrade head                      (solo bases ya selladas o vacías)
#     python -m app.cli db-upgrade              (recomendado: también adopta bases antiguas)
#     alembic revision -m "descripción"         (migración nueva, escrita a mano)

[alembic]
# %(here)s es la carpeta de este archivo: no depende del directorio de trabajo.
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# Para que ``import app`` funcione al invocar ``alembic`` desde cualquier carpeta.
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
