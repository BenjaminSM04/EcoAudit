map "$status:$uri" $ecoaudit_cache_control {
    default "";
    ~:/index\.html$ "no-cache";
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    # El límite por imagen de la API es 25 MiB. Reserve espacio para el multipart.
    client_max_body_size 30m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $ecoaudit_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/fhir+json image/svg+xml;

    # Resuelva el servicio de nuevo si Compose reemplaza su contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/ {
        proxy_pass http://$api_backend;
    }

    location = /api/dicomweb/studies {
        # El receptor limita el cuerpo STOW a cuatro veces el máximo por imagen.
        client_max_body_size 100m;
        proxy_pass http://$api_backend;
    }

    location = /api/cohorts/batch {
        # Límite operativo del cuerpo completo. Divida los lotes que lo superen.
        client_max_body_size 256m;
        proxy_pass http://$api_backend;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier otra ruta la resuelve el frontend.
    location / {
        try_files $uri /index.html;
    }
}
